<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Theme boot: before any CSS, so the page paints in the chosen theme. Mirrors theme.ts
         loadThemePref/resolveTheme (theme.test.ts runs both); its hash is in public/_headers (CSP). -->
    <script>
      (function () {
        var pref = "auto";
        try {
          var v = localStorage.getItem("pnct-map:theme");
          if (v === "light" || v === "dark") pref = v;
        } catch (e) {}
        var dark = pref === "auto" ? matchMedia("(prefers-color-scheme: dark)").matches : pref === "dark";
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.setAttribute("data-theme-pref", pref);
      })();
    </script>
    <title>Mapa PNCT · Territórios de Coesão Territorial | PNCT map of Portugal</title>
    <meta name="description" content="Mapa das freguesias abrangidas pelo Programa Nacional para a Coesão Territorial (PNCT) em Portugal continental, com ligações de pesquisa de imóveis no Idealista. Ferramenta não oficial. Map of the parishes covered by Portugal's PNCT territorial cohesion programme. Unofficial tool." />
    <link rel="canonical" href="https://pnct.singledev.eu/" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0f8a7e" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0c0c" />
    <link rel="preload" href="/data/pnct.topo.json" as="fetch" crossorigin />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mapa PNCT" />
    <meta property="og:title" content="Mapa PNCT · Territórios de Coesão Territorial | PNCT map of Portugal" />
    <meta property="og:description" content="Freguesias do PNCT em Portugal continental, com pesquisa de imóveis no Idealista. / Map of Portugal's PNCT parishes with Idealista property-search links." />
    <meta property="og:url" content="https://pnct.singledev.eu/" />
    <meta property="og:image" content="https://pnct.singledev.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mapa de Portugal continental com as freguesias do PNCT destacadas" />
    <meta property="og:locale" content="pt_PT" />
    <meta property="og:locale:alternate" content="en_GB" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mapa PNCT · Territórios de Coesão Territorial | PNCT map of Portugal" />
    <meta name="twitter:description" content="Freguesias do PNCT em Portugal continental, com pesquisa de imóveis no Idealista. / Map of Portugal's PNCT parishes with Idealista property-search links." />
    <meta name="twitter:image" content="https://pnct.singledev.eu/og-image.png" />
    <meta name="twitter:image:alt" content="Mapa de Portugal continental com as freguesias do PNCT destacadas" />
  </head>
  <body>
    <!-- No text here: every string comes from src/strings.*.ts by its data-i18n key (i18n.ts applyStatic). -->
    <div id="map" data-i18n-attr="aria-label:mapLabel"></div>

    <div class="toolbar">
      <div class="search">
        <label class="visually-hidden" for="search-input" data-i18n="searchLabel"></label>
        <input id="search-input" type="search" data-i18n-attr="placeholder:searchPlaceholder" autocomplete="off" spellcheck="false" />
        <ul id="search-list" hidden></ul>
      </div>
      <div class="filters">
        <label class="visually-hidden" for="district-select" data-i18n="districtLabel"></label>
        <select id="district-select">
          <option value="" data-i18n="allDistricts"></option>
        </select>
        <label class="toggle" data-i18n-attr="title:onlyPnctTitle">
          <input id="only-pnct" type="checkbox" data-i18n-attr="aria-label:onlyPnctLabel" />
          <span data-i18n="onlyPnct"></span>
        </label>
      </div>
    </div>

    <aside id="panel" class="panel" hidden aria-live="polite" data-testid="panel"></aside>

    <div class="legend" role="group" data-i18n-attr="aria-label:legend">
      <div class="legend-header">
        <button id="legend-toggle" type="button" class="legend-toggle" aria-expanded="true" aria-controls="legend-body">
          <span data-i18n="legend"></span><span class="legend-chevron" aria-hidden="true"></span>
        </button>
        <span class="legend-title" aria-hidden="true" data-i18n="legend"></span>
        <div id="settings" class="settings" role="group" data-i18n-attr="aria-label:settingsLabel" data-testid="settings"></div>
      </div>
      <div id="legend-body" class="legend-body">
      <div class="legend-row legend-concelho"><span class="swatch swatch-pnct"></span><span data-i18n="legendWhole"></span></div>
      <div class="legend-row legend-concelho"><span class="swatch swatch-partial"></span><span data-i18n="legendPartial"></span></div>
      <div class="legend-row legend-concelho legend-row-other"><span class="swatch swatch-other"></span><span data-i18n="legendNotPnct"></span></div>
      <div class="legend-row legend-parish"><span class="swatch swatch-pnct"></span><span data-i18n="legendPnctParish"></span></div>
      <div class="legend-row legend-parish legend-row-other"><span class="swatch swatch-other"></span><span data-i18n="legendOtherParish"></span></div>
      <div class="legend-row"><span class="swatch swatch-line"></span><span data-i18n="legendBoundary"></span></div>
      <div id="legend-protected" class="legend-protected" role="group" data-i18n-attr="aria-label:overlaysLabel" data-testid="legend-protected"></div>
      <button id="about-open" type="button" class="link-button" data-i18n="aboutButton"></button>
      </div>
    </div>

    <div id="tooltip" class="tooltip" hidden role="tooltip"></div>
    <div id="status" class="status" role="status" data-i18n="loadingMap"></div>

    <!-- Filled by about.ts. -->
    <dialog id="about" aria-labelledby="about-title"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
