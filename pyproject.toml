[project]
name = "pnct-map"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "geopandas>=1.2.0",
    "matplotlib>=3.11.2",
    "osmium>=4.3.2",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pyogrio>=0.13.0",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.6",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
