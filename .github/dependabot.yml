# Dependabot version updates: one weekly PR per group. Security alerts are separate (repo settings).
# Runtime npm dependencies (maplibre-gl, topojson-client) stay ungrouped: each gets its own PR, as a
# MapLibre bump changes what the site ships and needs the full suite plus a look on the phone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      uv:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
